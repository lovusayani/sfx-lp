# Swiss Liquidity — app.swissconnector.com (client app) and adm.swissconnector.com (admin).
# Installed as /etc/nginx/sites-available/swissliq.conf (+ symlink in sites-enabled).
# Traffic arrives through Cloudflare (proxied, SSL mode "Full (strict)") with a Cloudflare
# Origin Certificate in /home/swissliq/ssl/. No default_server here: Curreex keeps its defaults.

server {
  listen 80;
  listen [::]:80;
  server_name app.swissconnector.com adm.swissconnector.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name app.swissconnector.com adm.swissconnector.com;

  ssl_certificate     /home/swissliq/ssl/origin.pem;
  ssl_certificate_key /home/swissliq/ssl/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Real client IP from Cloudflare (https://www.cloudflare.com/ips/).
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;

  client_max_body_size 12m;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;

  # Admin only on adm.*; the client app only on app.*.
  set $sfx_admin_host 0;
  if ($host = adm.swissconnector.com) { set $sfx_admin_host 1; }

  location = / {
    if ($sfx_admin_host) { return 302 /admin; }
    proxy_pass http://127.0.0.1:3100;
  }
  location ^~ /admin {
    if ($sfx_admin_host = 0) { return 301 https://adm.swissconnector.com$request_uri; }
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_pass http://127.0.0.1:3100;
  }
  location /api/     { proxy_pass http://127.0.0.1:5100; }
  location /uploads/ { proxy_pass http://127.0.0.1:5100; }
  location /         { proxy_pass http://127.0.0.1:3100; }
}
