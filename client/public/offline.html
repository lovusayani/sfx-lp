<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0a">
<title>You're offline</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0c0a; color: #f7f7ef;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  @media (prefers-color-scheme: light) {
    :root { color-scheme: light; }
    html, body { background: #f6f4ec; color: #141511; }
    .card { background: #ffffff !important; border-color: rgba(168,129,26,.26) !important; }
    p { color: #6b6f63 !important; }
  }
  main { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  .card { max-width: 380px; width: 100%; border: 1px solid rgba(246,211,91,.27); background: rgba(24,26,18,.7);
    border-radius: 18px; padding: 28px 20px; text-align: center; }
  .dot { width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff1a8, #f5d34f 45%, #a88c31); }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 14px; line-height: 1.5; color: #969b8f; margin: 0 0 18px; }
  button { border: 0; border-radius: 12px; background: #f5d34f; color: #141511; font-weight: 600;
    font-size: 15px; padding: 12px 22px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="dot" aria-hidden="true"></div>
    <h1>You're offline</h1>
    <p>Your balances and trades need a connection. Check your internet and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</main>
</body>
</html>
